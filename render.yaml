services:
  - type: web
    name: rakshasetu
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput"
    startCommand: "gunicorn rakshasetu.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "YOUR-SERVICE.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: rakshasetu-db
          property: connectionString
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://YOUR-SERVICE.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://YOUR-SERVICE.onrender.com"

databases:
  - name: rakshasetu-db
    databaseName: rakshasetu
    user: rakshasetu
